<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; --ink:#192b3a; --muted:#718092; --blue:#2865d7; --line:#e6ebf1; --surface:#fff; --bg:#f4f7fb; --green:#16865b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    button,input { font:inherit; }
    .page { max-width:760px; margin:0 auto; padding:48px 22px 64px; }
    .eyebrow { margin:0 0 8px; color:var(--blue); font-size:12px; font-weight:750; letter-spacing:.12em; }
    h1 { margin:0; font-size:clamp(29px,5vw,38px); line-height:1.2; letter-spacing:-.04em; }
    .intro { margin:10px 0 28px; color:var(--muted); }
    .toolbar { display:flex; align-items:end; gap:14px; flex-wrap:wrap; padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 20px #1a36500a; }
    .field { display:grid; gap:7px; min-width:180px; flex:1; }
    .field span { color:#526173; font-size:13px; font-weight:650; }
    select,input[type=date] { height:44px; width:100%; padding:0 12px; border:1px solid #d8e0e9; border-radius:8px; background:#fff; color:var(--ink); outline:none; }
    select:focus,input[type=date]:focus { border-color:var(--blue); box-shadow:0 0 0 3px #2865d71c; }
    .summary { display:flex; justify-content:space-between; align-items:center; margin:26px 2px 12px; gap:12px; }
    h2 { margin:0; font-size:18px; }
    .count { color:var(--muted); font-size:14px; }
    .count strong { color:var(--green); }
    .list { display:grid; gap:9px; }
    .student { display:flex; align-items:center; gap:14px; min-height:66px; padding:13px 17px; background:var(--surface); border:1px solid var(--line); border-radius:11px; cursor:pointer; transition:border-color .15s,background .15s,transform .15s; }
    .student:hover { border-color:#b9cae5; transform:translateY(-1px); }
    .student.checked { border-color:#b8e1d0; background:#f4fbf7; }
    .student input { width:20px; height:20px; margin:0; accent-color:var(--green); flex:none; cursor:pointer; }
    .student-name { flex:1; font-weight:620; }
    .badge { color:var(--green); font-size:12px; font-weight:700; }
    .state { min-height:24px; margin:14px 3px 0; color:var(--muted); font-size:13px; }
    .state.error { color:#b42318; }
    .empty { padding:36px 20px; color:var(--muted); text-align:center; border:1px dashed #cdd7e2; border-radius:12px; background:#ffffff80; }
    .spinner { display:inline-block; width:14px; height:14px; margin-right:6px; vertical-align:-2px; border:2px solid #cbd5e1; border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(max-width:520px) { .page{padding:32px 16px 48px}.toolbar{align-items:stretch}.field{min-width:100%} }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">CLASSROOM · ATTENDANCE</p>
    <h1>課堂點名</h1>
    <p class="intro">選擇科目與日期，勾選出席學生後會即時儲存。</p>

    <section class="toolbar" aria-label="點名設定">
      <label class="field"><span>科目</span><select id="subject" disabled><option>載入中…</option></select></label>
      <label class="field"><span>日期</span><input id="date" type="date" disabled></label>
    </section>

    <section class="summary"><h2 id="list-title">學生名單</h2><div class="count" id="count"></div></section>
    <section class="list" id="list" aria-live="polite"><div class="empty"><span class="spinner"></span>正在載入科目…</div></section>
    <p class="state" id="state" role="status"></p>
  </main>
  <script>
    const subjectSelect = document.getElementById('subject');
    const dateInput = document.getElementById('date');
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const state = document.getElementById('state');
    let requestNumber = 0;

    function setBusy(message) {
      state.className = 'state';
      state.innerHTML = message ? `<span class="spinner"></span>${escapeHtml(message)}` : '';
    }
    function setError(error) {
      state.className = 'state error';
      state.textContent = error && error.message ? error.message : String(error || '發生錯誤，請稍後再試。');
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function loadRoster() {
      if (!subjectSelect.value || !dateInput.value) return;
      const currentRequest = ++requestNumber;
      list.innerHTML = '<div class="empty"><span class="spinner"></span>正在載入名單…</div>';
      count.textContent = '';
      setBusy('讀取點名資料');
      google.script.run.withSuccessHandler(data => {
        if (currentRequest !== requestNumber) return;
        renderRoster(data);
        state.textContent = '';
      }).withFailureHandler(error => {
        if (currentRequest !== requestNumber) return;
        list.innerHTML = '<div class="empty">無法載入名單，請確認試算表設定。</div>';
        setError(error);
      }).getAttendance(subjectSelect.value, dateInput.value);
    }
    function renderRoster(data) {
      document.getElementById('list-title').textContent = `${data.subject} · 學生名單`;
      const present = data.students.filter(student => student.present).length;
      count.innerHTML = `<strong>${present}</strong> / ${data.students.length} 人出席`;
      if (!data.students.length) {
        list.innerHTML = '<div class="empty">這個科目目前沒有學生資料。</div>';
        return;
      }
      list.innerHTML = data.students.map(student => `
        <label class="student${student.present ? ' checked' : ''}" data-row="${student.row}">
          <input type="checkbox" ${student.present ? 'checked' : ''} aria-label="${escapeHtml(student.name)} 出席">
          <span class="student-name">${escapeHtml(student.name)}</span>
          <span class="badge">${student.present ? '已出席' : ''}</span>
        </label>`).join('');
      list.querySelectorAll('.student input').forEach(input => input.addEventListener('change', onAttendanceChange));
    }
    function onAttendanceChange(event) {
      const input = event.currentTarget;
      const card = input.closest('.student');
      const row = Number(card.dataset.row);
      const desired = input.checked;
      input.disabled = true;
      setBusy(`正在儲存${card.querySelector('.student-name').textContent}的點名狀態`);
      google.script.run.withSuccessHandler(result => {
        input.disabled = false;
        input.checked = result.present;
        card.classList.toggle('checked', result.present);
        card.querySelector('.badge').textContent = result.present ? '已出席' : '';
        const total = list.querySelectorAll('.student').length;
        const present = list.querySelectorAll('.student input:checked').length;
        count.innerHTML = `<strong>${present}</strong> / ${total} 人出席`;
        state.textContent = '已儲存';
        window.setTimeout(() => { if (state.textContent === '已儲存') state.textContent = ''; }, 1600);
      }).withFailureHandler(error => {
        input.disabled = false;
        input.checked = !desired;
        setError(error);
      }).setAttendance(subjectSelect.value, dateInput.value, row, desired);
    }
    subjectSelect.addEventListener('change', loadRoster);
    dateInput.addEventListener('change', loadRoster);

    google.script.run.withSuccessHandler(data => {
      if (!data.subjects.length) {
        list.innerHTML = '<div class="empty">試算表中沒有工作表，請先新增科目工作表。</div>';
        state.textContent = '';
        return;
      }
      subjectSelect.innerHTML = data.subjects.map(subject => `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`).join('');
      subjectSelect.disabled = false;
      dateInput.value = data.today;
      dateInput.disabled = false;
      loadRoster();
    }).withFailureHandler(error => {
      list.innerHTML = '<div class="empty">無法連接名單試算表。</div>';
      setError(error);
    }).getInitialData();
  </script>
</body>
</html>
