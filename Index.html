<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <style>
    :root { --red:#c1121f; --red-dark:#780000; --black:#111111; --gray:#f2f2f2; --line:#d9d9d9; --white:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--black); background:var(--gray); font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    header { background:var(--black); color:var(--white); border-bottom:6px solid var(--red); padding:28px 20px; }
    .header-inner, main { max-width:1180px; margin:auto; }
    h1 { margin:0; font-size:clamp(1.6rem,4vw,2.5rem); letter-spacing:.06em; } .tagline { margin:8px 0 0; color:#d7d7d7; }
    main { padding:24px 20px 72px; display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:24px; }
    .category { margin-bottom:28px; } .category h2 { border-left:8px solid var(--red); margin:0 0 12px; padding:5px 12px; font-size:1.3rem; }
    .menu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
    .item-card { background:var(--white); border:1px solid var(--line); padding:16px; min-height:145px; display:flex; flex-direction:column; justify-content:space-between; }
    .item-card:hover { border-color:var(--black); } .item-name { font-size:1.1rem; font-weight:800; } .item-meta { margin-top:4px; color:#666; font-size:.86rem; }
    .choice-row { display:flex; gap:7px; margin-top:14px; } button { border:0; cursor:pointer; font:inherit; font-weight:750; }
    .add-button, .size-button { background:var(--black); color:var(--white); padding:9px 10px; flex:1; } .add-button:hover,.size-button:hover { background:var(--red); }
    .cart { background:var(--white); border-top:6px solid var(--red); align-self:start; position:sticky; top:16px; }
    .cart-header { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; } .cart-header h2 { margin:0; font-size:1.2rem; }
    .cart-items { min-height:70px; max-height:315px; overflow:auto; padding:6px 18px; }
    .empty { color:#777; text-align:center; margin:24px 0; } .cart-item { display:grid; grid-template-columns:1fr auto; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
    .cart-item-name { font-weight:800; } .cart-item-sub { color:#666; font-size:.85rem; margin-top:3px; } .cart-actions { display:flex; align-items:center; gap:6px; }
    .icon-button { background:#ededed; color:var(--black); width:28px; height:28px; font-size:1.1rem; } .icon-button:hover { background:var(--red); color:var(--white); }
    .cart-total { padding:14px 18px; display:flex; justify-content:space-between; font-size:1.15rem; font-weight:900; border-top:2px solid var(--black); }
    form { padding:0 18px 18px; } label { display:block; margin:12px 0 5px; font-size:.86rem; font-weight:750; } input,textarea,select { width:100%; padding:10px; border:1px solid #bdbdbd; border-radius:0; font:inherit; } textarea { resize:vertical; min-height:64px; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .submit { width:100%; margin-top:16px; padding:13px; color:var(--white); background:var(--red); font-size:1rem; } .submit:hover { background:var(--red-dark); } .submit:disabled { background:#9f9f9f; cursor:not-allowed; }
    .notes { background:#fff; border-left:5px solid var(--black); margin-top:24px; padding:14px 18px; } .notes p { margin:5px 0; }
    .toast { position:fixed; right:20px; bottom:20px; max-width:360px; background:var(--black); color:var(--white); padding:16px 18px; border-left:6px solid var(--red); box-shadow:0 6px 20px #0004; display:none; } .toast.show { display:block; }
    @media (max-width:800px) { main { grid-template-columns:1fr; } .cart { position:static; order:-1; } }
  </style>
</head>
<body>
  <header><div class="header-inner"><h1 id="restaurantName">載入菜單中…</h1><p class="tagline">線上點餐・現點現做</p></div></header>
  <main>
    <section><div id="menu"></div><div id="notes" class="notes"></div></section>
    <aside class="cart">
      <div class="cart-header"><h2>你的訂單</h2><span id="itemCount">0 項</span></div>
      <div id="cartItems" class="cart-items"></div><div class="cart-total"><span>合計</span><span id="total">NT$0</span></div>
      <form id="orderForm"><label for="orderType">取餐方式</label><select id="orderType"><option value="外帶">外帶</option><option value="內用">內用</option></select>
        <div class="field-row"><div><label for="customerName">訂購人</label><input id="customerName" maxlength="40" placeholder="外帶必填"></div><div><label for="tableNumber">桌號</label><input id="tableNumber" maxlength="20" placeholder="內用必填"></div></div>
        <label for="phone">電話（選填）</label><input id="phone" maxlength="30" inputmode="tel">
        <label for="note">備註（選填）</label><textarea id="note" maxlength="300" placeholder="例如：不要香菜"></textarea>
        <button id="submitButton" class="submit" type="submit">送出訂單</button>
      </form>
    </aside>
  </main><div id="toast" class="toast" role="status"></div>
  <script>
    let menuData; const cart = new Map(); const money = n => `NT$${n}`;
    function makeKey(category, item, size='') { return `${category}|${item.name}|${item.style || ''}|${size}`; }
    function displayName(item) { return `${item.style || ''}${item.name}`; }
    function renderMenu(menu) {
      document.getElementById('restaurantName').textContent = menu.restaurant;
      const root = document.getElementById('menu'); root.innerHTML = '';
      menu.categories.forEach(category => { const section = document.createElement('section'); section.className='category'; section.innerHTML=`<h2>${category.name}</h2><div class="menu-grid"></div>`; const grid=section.querySelector('.menu-grid');
        category.items.forEach(item => { const card=document.createElement('article'); card.className='item-card'; const prices=item.prices || {}; const hasSizes=Object.keys(prices).length>0; card.innerHTML=`<div><div class="item-name"></div><div class="item-meta"></div></div><div class="choice-row"></div>`; card.querySelector('.item-name').textContent=displayName(item); card.querySelector('.item-meta').textContent=hasSizes ? Object.entries(prices).map(([s,p])=>`${s} ${money(p)}`).join('　') : `${item.unit ? `${item.unit}・` : ''}${money(item.price)}`;
          const row=card.querySelector('.choice-row'); if(hasSizes) Object.entries(prices).forEach(([size,price])=>{const b=document.createElement('button');b.type='button';b.className='size-button';b.textContent=`${size} ${money(price)}`;b.onclick=()=>addItem({key:makeKey(category.name,item,size),name:displayName(item),size,price,category:category.name});row.appendChild(b);});
          else {const b=document.createElement('button');b.type='button';b.className='add-button';b.textContent=`加入 ${money(item.price)}`;b.onclick=()=>addItem({key:makeKey(category.name,item),name:item.name,size:'',price:item.price,category:category.name});row.appendChild(b);} grid.appendChild(card); }); root.appendChild(section); });
      if (menu.addOns && menu.addOns.length) { const section=document.createElement('section'); section.className='category'; section.innerHTML='<h2>加購</h2><div class="menu-grid"></div>'; const grid=section.querySelector('.menu-grid'); menu.addOns.forEach(item=>{const card=document.createElement('article');card.className='item-card';card.innerHTML=`<div><div class="item-name"></div><div class="item-meta"></div></div><div class="choice-row"></div>`;card.querySelector('.item-name').textContent=`${item.name}（${item.quantity}顆）`;card.querySelector('.item-meta').textContent=item.condition;const b=document.createElement('button');b.type='button';b.className='add-button';b.textContent=`加入 ${money(item.price)}`;b.onclick=()=>addItem({key:`加購|${item.name}||`,name:`${item.name}（${item.quantity}顆）`,size:'',price:item.price,category:'加購'});card.querySelector('.choice-row').appendChild(b);grid.appendChild(card);});root.appendChild(section); }
      document.getElementById('notes').innerHTML='<strong>店家提醒</strong>'; menu.notes.forEach(note=>{const p=document.createElement('p');p.textContent=`・${note}`;document.getElementById('notes').appendChild(p);});
    }
    function addItem(item) { const existing=cart.get(item.key); cart.set(item.key, existing ? {...existing,quantity:existing.quantity+1} : {...item,quantity:1}); renderCart(); }
    function changeQuantity(key, delta) { const item=cart.get(key); if(!item)return; item.quantity+=delta; if(item.quantity<=0)cart.delete(key); renderCart(); }
    function renderCart() { const list=document.getElementById('cartItems'); list.innerHTML=''; const items=[...cart.values()]; document.getElementById('itemCount').textContent=`${items.reduce((n,i)=>n+i.quantity,0)} 項`; const total=items.reduce((n,i)=>n+i.price*i.quantity,0); document.getElementById('total').textContent=money(total); if(!items.length){list.innerHTML='<p class="empty">尚未選擇餐點</p>';return;} items.forEach(item=>{const el=document.createElement('div');el.className='cart-item';el.innerHTML=`<div><div class="cart-item-name"></div><div class="cart-item-sub"></div></div><div class="cart-actions"><button class="icon-button" type="button">−</button><strong>${item.quantity}</strong><button class="icon-button" type="button">＋</button></div>`;el.querySelector('.cart-item-name').textContent=item.name+(item.size?`・${item.size}`:'');el.querySelector('.cart-item-sub').textContent=`${money(item.price)} × ${item.quantity} = ${money(item.price*item.quantity)}`;const buttons=el.querySelectorAll('button');buttons[0].onclick=()=>changeQuantity(item.key,-1);buttons[1].onclick=()=>changeQuantity(item.key,1);list.appendChild(el);}); }
    function showToast(message) { const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),5500); }
    document.getElementById('orderForm').addEventListener('submit', event=>{ event.preventDefault(); if(!cart.size){showToast('請先選擇至少一項餐點。');return;} const button=document.getElementById('submitButton');button.disabled=true;button.textContent='傳送訂單中…'; const order={orderType:orderType.value,customerName:customerName.value,tableNumber:tableNumber.value,phone:phone.value,note:note.value,items:[...cart.values()].map(({key,quantity})=>({key,quantity}))}; google.script.run.withSuccessHandler(result=>{showToast(`訂單 ${result.orderId} 已送出，合計 ${money(result.total)}。`);window.setTimeout(()=>{if(result.ordersSheetUrl && confirm(`訂單已儲存到「${result.ordersSheetName}」。\n\n是否開啟試算表確認？`)) window.open(result.ordersSheetUrl, '_blank');},150);cart.clear();document.getElementById('orderForm').reset();renderCart();button.disabled=false;button.textContent='送出訂單';}).withFailureHandler(error=>{showToast(error.message || '送出失敗，請稍後再試。');button.disabled=false;button.textContent='送出訂單';}).submitOrder(order); });
    google.script.run.withSuccessHandler(menu=>{menuData=menu;renderMenu(menu);renderCart();}).withFailureHandler(error=>showToast(`無法載入菜單：${error.message}`)).getMenu();
  </script>
</body>
</html>
